<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom Dashboard | لوحة التحكم</title>
    <!-- استيراد خطوط وأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --main-bg: #36393f;
            --sidebar-bg: #2f3136;
            --card-bg: #202225;
            --accent-color: #5865F2;
            --success-color: #3ba55c;
            --danger-color: #ed4245;
            --text-color: #dcddde;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--main-bg);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .dashboard {
            width: 90%;
            max-width: 1000px;
            background: var(--sidebar-bg);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        .header {
            background: var(--accent-color);
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 30px;
        }

        @media (max-width: 768px) {
            .content { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border-top: 4px solid var(--accent-color);
            transition: transform 0.3s ease;
        }

        .card:hover { transform: translateY(-5px); }

        .card h3 {
            margin-top: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
        }

        .form-group { margin-bottom: 15px; }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            opacity: 0.8;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #202225;
            background: #40444b;
            color: white;
            box-sizing: border-box;
            outline: none;
            transition: border 0.3s;
        }

        input:focus { border-color: var(--accent-color); }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Cairo';
            font-size: 16px;
            transition: opacity 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-success { background: var(--success-color); color: white; }
        .btn-danger { background: var(--danger-color); color: white; }
        .btn:hover { opacity: 0.8; }

        .footer {
            text-align: center;
            padding: 15px;
            font-size: 12px;
            opacity: 0.5;
            background: #292b2f;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="header">
            <i class="fab fa-discord"></i>
            Phantom Bot Management Panel
        </div>

        <div class="content">
            <!-- قسم التذاكر -->
            <div class="card">
                <h3><i class="fas fa-ticket-alt"></i> إعدادات التذاكر</h3>
                <form action="/setup_tickets" method="POST">
                    <div class="form-group">
                        <label>Server ID (ID السيرفر)</label>
                        <input type="text" name="guild_id" placeholder="أدخل ID السيرفر" required>
                    </div>
                    <div class="form-group">
                        <label>Admin Role ID (رتبة الإدارة)</label>
                        <input type="text" name="admin_role" placeholder="أدخل ID الرتبة" required>
                    </div>
                    <div class="form-group">
                        <label>Ticket Channel ID (قناة التذاكر)</label>
                        <input type="text" name="channel_id" placeholder="أدخل ID القناة" required>
                    </div>
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-paper-plane"></i> حفظ وإرسال الرسالة
                    </button>
                </form>
            </div>

            <!-- قسم البرودكاست -->
            <div class="card" style="border-top-color: var(--danger-color);">
                <h3><i class="fas fa-bullhorn"></i> نظام البرودكاست</h3>
                <form action="/broadcast" method="POST">
                    <div class="form-group">
                        <label>Server ID (ID السيرفر)</label>
                        <input type="text" name="guild_id" required>
                    </div>
                    <div class="form-group">
                        <label>Message Content (الرسالة)</label>
                        <textarea name="msg" rows="5" placeholder="اكتب رسالتك هنا..." required></textarea>
                    </div>
                    <button type="submit" class="btn btn-danger">
                        <i class="fas fa-users"></i> إرسال للجميع الآن
                    </button>
                </form>
            </div>
        </div>

        <div class="footer">
            تم التطوير بواسطة ذكاء اصطناعي | Phantom Bot 2026 ©
        </div>
    </div>

</body>
</html>
