<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Phantom Pro Dashboard | لوحة التحكم المتكاملة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #36393f; --sidebar: #2f3136; --card: #202225; --accent: #5865F2; --success: #3ba55c; --danger: #ed4245; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: #dcddde; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        .status-bar { background: var(--card); padding: 15px; border-radius: 10px; margin-bottom: 20px; display: flex; justify-content: space-around; border-bottom: 4px solid var(--accent); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; }
        .card { background: var(--sidebar); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h3 { border-bottom: 1px solid #4f545c; padding-bottom: 10px; margin-top: 0; display: flex; align-items: center; gap: 10px; color: white; }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; background: #40444b; color: white; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 5px; cursor: pointer; color: white; font-weight: bold; transition: 0.3s; }
        .btn-blue { background: var(--accent); } .btn-green { background: var(--success); } .btn-red { background: var(--danger); }
        .btn:hover { opacity: 0.8; transform: translateY(-2px); }
        .stat-val { font-weight: bold; color: var(--accent); }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-align: center;"><i class="fab fa-discord"></i> Phantom Pro Application</h1>
        
        <!-- إحصائيات حية -->
        <div class="status-bar">
            <div>حالة البوت: <span class="stat-val">{{ status }}</span></div>
            <div>الأعضاء: <span class="stat-val">{{ member_count }}</span></div>
            <div>سرعة الاستجابة: <span class="stat-val">{{ ping }}ms</span></div>
            <div>تذاكر مفتوحة: <span class="stat-val">{{ open_tickets }}</span></div>
        </div>

        <div class="grid">
            <!-- 1. إعدادات التذاكر واللوق -->
            <div class="card">
                <h3><i class="fas fa-ticket-alt"></i> إعدادات التذاكر واللوق</h3>
                <form action="/update_settings" method="POST">
                    <input type="text" name="guild_id" placeholder="ID السيرفر" required>
                    <input type="text" name="admin_roles" placeholder="IDs الرتب (فصل بفاصلة ,)" required>
                    <input type="text" name="channel_id" placeholder="ID قناة الزر" required>
                    <input type="text" name="category_id" placeholder="ID القسم (Category)">
                    <input type="text" name="log_channel" placeholder="ID قناة اللوق" required>
                    <button type="submit" class="btn btn-blue">حفظ الإعدادات وإرسال الزر</button>
                </form>
            </div>

            <!-- 2. الردود التلقائية -->
            <div class="card">
                <h3><i class="fas fa-robot"></i> الردود التلقائية</h3>
                <form action="/add_auto_reply" method="POST">
                    <input type="text" name="keyword" placeholder="الكلمة (مثال: قوانين)" required>
                    <textarea name="response" placeholder="الرد التلقائي" rows="3" required></textarea>
                    <button type="submit" class="btn btn-green">إضافة رد جديد</button>
                </form>
            </div>

            <!-- 3. نظام البرودكاست -->
            <div class="card">
                <h3><i class="fas fa-bullhorn"></i> نظام البرودكاست (DM)</h3>
                <form action="/broadcast" method="POST">
                    <input type="text" name="guild_id" placeholder="ID السيرفر" required>
                    <textarea name="msg" placeholder="اكتب الرسالة التي ستصل للجميع في الخاص..." rows="4" required></textarea>
                    <button type="submit" class="btn btn-red">إرسال للجميع الآن</button>
                </form>
            </div>

            <!-- 4. رتب ماين كرافت -->
            <div class="card">
                <h3><i class="fas fa-cubes"></i> رتب ماين كرافت (XP)</h3>
                <p style="font-size: 13px; color: #8e9297;">سيتم إنشاء 20 رتبة وتوزيعها تلقائياً على المتفاعلين.</p>
                <form action="/create_mc_roles" method="POST">
                    <input type="text" name="guild_id" placeholder="ID السيرفر" required>
                    <button type="submit" class="btn" style="background: #f1c40f; color: black;">إنشاء 20 رتبة الآن</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
