<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Phantom Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; background: #36393f; color: white; padding: 20px; text-align: center; }
        .card { background: #2f3136; padding: 20px; border-radius: 10px; margin: 10px; display: inline-block; width: 300px; vertical-align: top; }
        input, textarea { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }
        .btn { background: #5865F2; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        .status { background: #202225; padding: 10px; border-radius: 5px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1>Phantom Control Panel 🤖</h1>
    <div class="status">
        حالة البوت: {{ status }} | الأعضاء: {{ member_count }}
    </div>
    
    <div class="card">
        <h3>⚙️ الإعدادات</h3>
        <form action="/update_settings" method="POST">
            <input type="text" name="guild_id" placeholder="ID السيرفر" required>
            <input type="text" name="admin_roles" placeholder="IDs الرتب (فصل بفاصلة)">
            <input type="text" name="channel_id" placeholder="ID قناة الزر">
            <input type="text" name="category_id" placeholder="ID القسم">
            <input type="text" name="log_channel" placeholder="ID قناة اللوق">
            <button class="btn">حفظ وإرسال الزر</button>
        </form>
    </div>

    <div class="card">
        <h3>🎮 رتب ماين كرافت</h3>
        <form action="/create_mc_roles" method="POST">
            <input type="text" name="guild_id" placeholder="ID السيرفر" required>
            <button class="btn" style="background: #f1c40f; color: black;">إنشاء 20 رتبة الآن</button>
        </form>
    </div>
</body>
</html>
