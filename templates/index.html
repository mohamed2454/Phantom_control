<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم Phantom Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #36393f; --sidebar: #2f3136; --card: #202225;
            --accent: #5865F2; --success: #3ba55c; --danger: #ed4245; --text: #dcddde;
        }
        body { font-family: 'Cairo', sans-serif; background: var(--bg-dark); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        .header { background: var(--accent); padding: 20px; border-radius: 10px; text-align: center; color: white; font-size: 24px; margin-bottom: 20px; }
        .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; }
        .stat-item { background: var(--card); padding: 15px; border-radius: 8px; text-align: center; border-bottom: 3px solid var(--accent); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; }
        .card { background: var(--sidebar); padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .card h3 { border-bottom: 1px solid #4f545c; padding-bottom: 10px; margin-top: 0; display: flex; align-items: center; gap: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #b9bbbe; }
        input, textarea { width: 100%; padding: 10px; border-radius: 5px; border: none; background: #40444b; color: white; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-family: 'Cairo'; transition: 0.3s; color: white; }
        .btn-blue { background: var(--accent); } .btn-green { background: var(--success); } .btn-red { background: var(--danger); }
        .btn:hover { opacity: 0.8; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><i class="fab fa-discord"></i> Phantom Pro Dashboard</div>
        
        <div class="stats-bar">
            <div class="stat-item"><i class="fas fa-users"></i> الأعضاء: {{ member_count }}</div>
            <div class="stat-item"><i class="fas fa-ticket-alt"></i> تذاكر مفتوحة: {{ open_tickets }}</div>
            <div class="stat-item"><i class="fas fa-bolt"></i> السرعة: {{ ping }}ms</div>
        </div>

        <div class="grid">
            <!-- إعدادات التذاكر واللوق -->
            <div class="card">
                <h3><i class="fas fa-ticket-alt"></i> إعدادات التذاكر واللوق</h3>
                <form action="/update_settings" method="POST">
                    <div class="form-group"><label>ID السيرفر:</label><input type="text" name="guild_id" required></div>
                    <div class="form-group"><label>IDs رتب الإدارة (فصل بفاصلة):</label><input type="text" name="admin_roles" placeholder="رتبة1, رتبة2" required></div>
                    <div class="form-group"><label>ID قناة زر التذاكر:</label><input type="text" name="channel_id" required></div>
                    <div class="form-group"><label>ID القسم (Category) للتذاكر:</label><input type="text" name="category_id" placeholder="اتركه فارغاً للوضع العام"></div>
                    <div class="form-group"><label>ID قناة اللوق (Logging):</label><input type="text" name="log_channel" required></div>
                    <button type="submit" class="btn btn-blue">حفظ الإعدادات وإرسال الزر</button>
                </form>
            </div>

            <!-- الردود التلقائية -->
            <div class="card">
                <h3><i class="fas fa-robot"></i> الردود التلقائية</h3>
                <form action="/add_auto_reply" method="POST">
                    <input type="text" name="keyword" placeholder="الكلمة المفتاحية" required>
                    <textarea name="response" placeholder="الرد الذي سيظهر" rows="3" required></textarea>
                    <button type="submit" class="btn btn-green">إضافة رد جديد</button>
                </form>
            </div>

            <!-- رتب ماين كرافت -->
            <div class="card">
                <h3><i class="fas fa-cubes"></i> رتب ماين كرافت (20 رتبة)</h3>
                <p style="font-size: 13px; color: #8e9297;">سيتم إنشاء رتب (Steve, Creeper, etc) وإعطاؤها تلقائياً للأعضاء المتفاعلين.</p>
                <form action="/create_mc_roles" method="POST">
                    <input type="text" name="guild_id" placeholder="ID السيرفر" required>
                    <button type="submit" class="btn" style="background: #f1c40f; color: black;">إنشاء الرتب الآن</button>
                </form>
            </div>

            <!-- البرودكاست -->
            <div class="card">
                <h3><i class="fas fa-bullhorn"></i> برودكاست للأعضاء</h3>
                <form action="/broadcast" method="POST">
                    <input type="text" name="guild_id" placeholder="ID السيرفر" required>
                    <textarea name="msg" placeholder="اكتب رسالتك الخاصة هنا..." rows="3" required></textarea>
                    <button type="submit" class="btn btn-red">إرسال للجميع في الخاص</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
