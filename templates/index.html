<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Phantom Pro Dashboard | لوحة التحكم المتطورة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --main-bg: #36393f; --sidebar-bg: #2f3136; --card-bg: #202225; --accent: #5865F2; --success: #3ba55c; --danger: #ed4245; }
        body { font-family: 'Cairo', sans-serif; background: var(--main-bg); color: #dcddde; margin: 0; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; max-width: 1200px; margin: auto; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; border-top: 4px solid var(--accent); }
        .stats-bar { grid-column: 1 / -1; display: flex; justify-content: space-around; background: var(--accent); padding: 15px; border-radius: 10px; color: white; margin-bottom: 20px; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; background: #40444b; color: white; }
        .btn { width: 100%; padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; transition: 0.3s; }
        .btn-blue { background: var(--accent); }
        .btn-green { background: var(--success); }
        .btn-red { background: var(--danger); }
        h2, h3 { text-align: center; color: white; }
    </style>
</head>
<body>

    <div class="stats-bar">
        <span><i class="fas fa-users"></i> الأعضاء: {{ member_count }}</span>
        <span><i class="fas fa-ticket-alt"></i> تذاكر مفتوحة: {{ open_tickets }}</span>
        <span><i class="fas fa-signal"></i> سرعة الاتصال: {{ ping }}ms</span>
    </div>

    <div class="grid">
        <!-- إعدادات النظام -->
        <div class="card">
            <h3><i class="fas fa-cog"></i> الإعدادات العامة</h3>
            <form action="/update_settings" method="POST">
                <label>ID السيرفر:</label>
                <input type="text" name="guild_id" required>
                <label>ID رتبة الإدارة:</label>
                <input type="text" name="admin_role" required>
                <label>ID قناة التذاكر:</label>
                <input type="text" name="channel_id" required>
                <label>ID قناة اللوق (Logging):</label>
                <input type="text" name="log_channel" required>
                <button type="submit" class="btn btn-blue">حفظ كل الإعدادات</button>
            </form>
        </div>

        <!-- الردود التلقائية -->
        <div class="card" style="border-top-color: var(--success);">
            <h3><i class="fas fa-reply"></i> الردود التلقائية</h3>
            <form action="/add_auto_reply" method="POST">
                <input type="text" name="keyword" placeholder="الكلمة المفتاحية (مثال: السلام)" required>
                <textarea name="response" placeholder="الرد التلقائي"></textarea>
                <button type="submit" class="btn btn-green">إضافة رد جديد</button>
            </form>
        </div>

        <!-- إنشاء رتب ماين كرافت -->
        <div class="card" style="border-top-color: #f1c40f;">
            <h3><i class="fas fa-cube"></i> رتب ماين كرافت</h3>
            <p style="font-size: 12px;">سيقوم البوت بإنشاء 20 رتبة (Zombie, Villager...) بألوان مختلفة.</p>
            <form action="/create_mc_roles" method="POST">
                <input type="text" name="guild_id" placeholder="ID السيرفر" required>
                <button type="submit" class="btn" style="background: #f1c40f; color: black;">إنشاء الرتب الآن</button>
            </form>
        </div>
        
        <!-- البرودكاست -->
        <div class="card" style="border-top-color: var(--danger);">
            <h3><i class="fas fa-bullhorn"></i> برودكاست</h3>
            <form action="/broadcast" method="POST">
                <input type="text" name="guild_id" placeholder="ID السيرفر" required>
                <textarea name="msg" placeholder="رسالة للجميع..."></textarea>
                <button type="submit" class="btn btn-red">إرسال للكل</button>
            </form>
        </div>
    </div>

</body>
</html>
