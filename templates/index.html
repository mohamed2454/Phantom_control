<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom Bot - لوحة التحكم</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2e 0%, #2d2d44 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
            animation: slideDown 0.5s ease-out;
        }
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            background: #10b981;
            border-radius: 20px;
            font-size: 0.9em;
            margin-top: 10px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            animation: fadeIn 0.6s ease-out;
        }
        .card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }
        .card h2 {
            font-size: 1.2em;
            margin-bottom: 15px;
            color: #00d4ff;
        }
        .stat {
            font-size: 2.5em;
            font-weight: bold;
            color: #7c3aed;
            margin: 10px 0;
        }
        .stat-label {
            font-size: 0.9em;
            color: #b0b0b0;
        }
        .form-group {
            margin: 15px 0;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #00d4ff;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-family: inherit;
            transition: all 0.3s ease;
        }
        /* لتلوين خيارات الـ Select باللون الداكن ليناسب المتصفحات */
        select option {
            background: #2d2d44;
            color: #fff;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.1);
            border-color: #7c3aed;
            box-shadow: 0 0 10px rgba(124, 58, 237, 0.3);
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        button {
            background: linear-gradient(135deg, #7c3aed, #00d4ff);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(124, 58, 237, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        .section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            animation: fadeIn 0.7s ease-out;
        }
        .section h2 {
            font-size: 1.8em;
            margin-bottom: 20px;
            color: #00d4ff;
            border-bottom: 2px solid #7c3aed;
            padding-bottom: 10px;
        }
        .section form {
            display: grid;
            gap: 15px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            header h1 {
                font-size: 1.8em;
            }
        }
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>👻 Phantom Bot</h1>
            <span class="status-badge">{{ status }}</span>
            <p style="margin-top: 10px; color: #b0b0b0;">لوحة تحكم البوت المتقدمة</p>
        </header>

        <div class="grid">
            <div class="card">
                <h2>📊 الحالة</h2>
                <div class="stat">{{ status }}</div>
                <div class="stat-label">حالة الاتصال</div>
            </div>
            <div class="card">
                <h2>👥 الأعضاء</h2>
                <div class="stat">{{ member_count }}</div>
                <div class="stat-label">عدد أعضاء السيرفر</div>
            </div>
            <div class="card">
                <h2>⏱️ البينج</h2>
                <div class="stat">{{ ping }}ms</div>
                <div class="stat-label">سرعة الاتصال</div>
            </div>
            <div class="card">
                <h2>🎫 التذاكر</h2>
                <div class="stat">{{ open_tickets }}</div>
                <div class="stat-label">تذاكر مفتوحة</div>
            </div>
        </div>

        <!-- قسم الإعدادات التفاعلية المطور -->
        <div class="section">
            <h2>⚙️ إعدادات السيرفر وا
