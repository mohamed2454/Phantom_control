<div class="section">
            <h2>⚙️ إعدادات السيرفر المتقدمة</h2>
            <form method="POST" action="/update_settings">
                <div class="form-row">
                    <div class="form-group">
                        <label>اختر السيرفر المتصل بالبوت</label>
                        <select name="guild_id" id="guild_select" required style="padding: 12px; background: rgba(255, 255, 255, 0.08); border-radius: 8px;">
                            <option value="">-- اختر السيرفر لتفعيل البوت فيه --</option>
                            {% for guild in guilds %}
                            <option value="{{ guild.id }}">{{ guild.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>قناة فتح التذاكر (Channel)</label>
                        <select name="channel_id" id="channel_select" required style="padding: 12px; background: rgba(255, 255, 255, 0.08); border-radius: 8px;">
                            <option value="">-- اختر السيرفر أولاً --</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>قناة السجل (Optional)</label>
                        <select name="log_channel" id="log_channel_select" style="padding: 12px; background: rgba(255, 255, 255, 0.08); border-radius: 8px;">
                            <option value="">-- اختر السيرفر أولاً --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>فئة التذاكر / الكتالوج (Category - Optional)</label>
                        <select name="category_id" id="category_select" style="padding: 12px; background: rgba(255, 255, 255, 0.08); border-radius: 8px;">
                            <option value="">-- اختر السيرفر أولاً --</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>الرتب المسؤولة عن التذاكر (يمكنك اختيار أكثر من رتبة)</label>
                    <select name="admin_roles" id="roles_select" multiple style="padding: 12px; background: rgba(255, 255, 255, 0.08); border-radius: 8px; height: 130px; overflow-y: auto;">
                        <option value="">-- اختر السيرفر أولاً --</option>
                    </select>
                    <p style="font-size: 0.85em; color: #b0b0b0; margin-top: 5px;">* اضغط باستمرار على زر Ctrl (أو Cmd في الماك) أثناء النقر لتحديد أكثر من رتبة.</p>
                </div>
                <button type="submit">💾 حفظ الإعدادات وإطلاق التذاكر</button>
            </form>
        </div>

        <!-- برمجة تفاعلية لتحديث القوائم ديناميكياً عند اختيار السيرفر -->
        <script>
        document.getElementById('guild_select').addEventListener('change', function() {
            const guildId = this.value;
            const channelSelect = document.getElementById('channel_select');
            const logChannelSelect = document.getElementById('log_channel_select');
            const categorySelect = document.getElementById('category_select');
            const rolesSelect = document.getElementById('roles_select');

            // إظهار نص التحميل مؤقتاً
            channelSelect.innerHTML = '<option value="">-- جاري تحميل القنوات... --</option>';
            logChannelSelect.innerHTML = '<option value="">-- جاري تحميل القنوات... --</option>';
            categorySelect.innerHTML = '<option value="">-- جاري تحميل الفئات... --</option>';
            rolesSelect.innerHTML = '<option value="">-- جاري تحميل الرتب... --</option>';

            if (!guildId) {
                channelSelect.innerHTML = '<option value="">-- اختر السيرفر أولاً --</option>';
                logChannelSelect.innerHTML = '<option value="">-- اختر السيرفر أولاً --</option>';
                categorySelect.innerHTML = '<option value="">-- اختر السيرفر أولاً --</option>';
                rolesSelect.innerHTML = '<option value="">-- اختر السيرفر أولاً --</option>';
                return;
            }

            // الاتصال بنقطة الـ API في البوت لجلب معلومات السيرفر
            fetch(`/api/guild_details/${guildId}`)
                .then(res => res.json())
                .then(data => {
                    if (data.error) {
                        alert("حدث خطأ: " + data.error);
                        return;
                    }

                    // 1. ملء قائمة قنوات التذاكر
                    let chOptions = '<option value="">-- اختر القناة المناسبة --</option>';
                    data.channels.forEach(ch => {
                        chOptions += `<option value="${ch.id}"># ${ch.name}</option>`;
                    });
                    channelSelect.innerHTML = chOptions;

                    // 2. ملء قائمة قناة السجلات
                    let logOptions = '<option value="">-- بدون قناة سجل (ملغاة) --</option>';
                    data.channels.forEach(ch => {
                        logOptions += `<option value="${ch.id}"># ${ch.name}</option>`;
                    });
                    logChannelSelect.innerHTML = logOptions;

                    // 3. ملء قائمة فئات/كتالوج التذاكر
                    let catOptions = '<option value="">-- بدون فئة (المستوى العام) --</option>';
                    data.categories.forEach(cat => {
                        catOptions += `<option value="${cat.id}">📁 ${cat.name}</option>`;
                    });
                    categorySelect.innerHTML = catOptions;

                    // 4. ملء الرتب المسؤولين
                    let roleOptions = '';
                    data.roles.forEach(role => {
                        roleOptions += `<option value="${role.id}">${role.name}</option>`;
                    });
                    rolesSelect.innerHTML = roleOptions || '<option value="">لا توجد رتب مهيأة بالسيرفر</option>';
                })
                .catch(err => {
                    console.error(err);
                    alert("فشل في استرداد معلومات السيرفر من البوت.");
                });
        });
        </script>
